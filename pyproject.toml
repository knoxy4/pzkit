[project]
name = "pzkit"
version = "0.1.0"
description = "Project Zomboid B42 mod tooling: parse, scaffold, validate, test"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp"]
semantic = ["lancedb"]
dev = ["ruff", "pytest"]

[project.scripts]
pzkit = "pzkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pzkit"]

[tool.ruff]
line-length = 100
